spring:
  application:
    name: smartfinance

  datasource:
    url: jdbc:postgresql://ep-odd-surf-auld2f4x.c-10.us-east-1.aws.neon.tech/neondb?sslmode=require
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      properties:
        hibernate:
          format_sql: true

    flyway:
      enabled: true
      locations: classpath:db/migration

server:
  port: 8080
